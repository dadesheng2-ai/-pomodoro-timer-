<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Pomodoro — 集中タイマー</title>
<style>
:root{--bg:#f5f3ee;--paper:#fffefa;--ink:#242722;--muted:#8b8d84;--line:#e9e7df;--red:#d6634f;--red-dark:#b94f3e;--green:#738674;--shadow:0 18px 60px #31332b0d;--accent:var(--red)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans','Noto Sans JP',sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}
.app{width:min(100%,980px);min-height:660px;background:var(--paper);border:1px solid #eeece5;border-radius:24px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 310px;overflow:hidden}
.main{padding:30px 48px 36px;display:flex;flex-direction:column;align-items:center;position:relative}.top{width:100%;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:11px;align-items:center;font-weight:700;letter-spacing:.02em;font-size:14px}.brandmark{width:30px;height:30px;border-radius:10px;background:#f9e7e2;color:var(--red);display:grid;place-items:center;font-size:16px}.top-actions{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:transparent;color:#676a61;width:36px;height:36px;border-radius:11px;cursor:pointer;font-size:16px;transition:.2s}.icon-btn:hover{background:#f7f5ef;color:var(--ink)}
.mode-tabs{display:flex;gap:5px;background:#f4f2ec;padding:5px;border-radius:13px;margin-top:45px}.mode{border:0;background:transparent;border-radius:9px;color:#77796f;padding:10px 20px;font:500 13px inherit;cursor:pointer;transition:.2s}.mode.active{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px #26291b0d}.timer-wrap{position:relative;width:min(310px,72vw);aspect-ratio:1;margin:31px auto 22px;display:grid;place-items:center}.ring{position:absolute;inset:0;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:5}.track{stroke:#efede7}.progress{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .45s linear,stroke .25s}.timer-center{text-align:center;z-index:1}.time{font-family:'DM Mono',monospace;font-size:76px;letter-spacing:-.075em;font-weight:400;font-variant-numeric:tabular-nums;line-height:1}.timer-label{font-size:13px;color:var(--muted);margin-top:14px}.session-dots{display:flex;gap:8px;justify-content:center;margin-top:17px}.dot{width:7px;height:7px;border-radius:50%;background:#deddd5}.dot.done{background:var(--accent)}.dot.current{outline:1px solid var(--accent);outline-offset:3px}
.task{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:center;width:min(340px,90%);padding:10px 4px 12px;font:500 14px 'DM Sans','Noto Sans JP',sans-serif;color:var(--ink);outline:none}.task::placeholder{color:#b3b3aa}.controls{display:flex;align-items:center;gap:13px;margin-top:23px}.primary{height:52px;min-width:156px;padding:0 25px;border:0;border-radius:15px;background:var(--accent);color:#fff;font:600 15px 'DM Sans','Noto Sans JP',sans-serif;cursor:pointer;box-shadow:0 5px 14px color-mix(in srgb,var(--accent) 25%,transparent);transition:transform .15s,background .2s}.primary:hover{transform:translateY(-1px);background:var(--red-dark)}.secondary{height:44px;width:44px;border:1px solid var(--line);border-radius:13px;background:transparent;color:#696b63;cursor:pointer;font-size:16px}.secondary:hover{background:#f7f5ef}.hint{font-size:11px;color:#a2a398;margin-top:auto;padding-top:26px}
.side{background:#faf9f5;border-left:1px solid #efede6;padding:32px 25px;display:flex;flex-direction:column}.side-title{font-size:13px;font-weight:700;letter-spacing:.03em;margin:3px 0 21px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 14px}.stat-label{font-size:11px;color:var(--muted);margin-bottom:8px}.stat-value{font:500 24px 'DM Mono',monospace;letter-spacing:-.05em}.stat-unit{font:400 11px 'DM Sans','Noto Sans JP',sans-serif;color:var(--muted);margin-left:4px}.divider{border:0;border-top:1px solid var(--line);margin:23px 0}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-head h2{font-size:13px;margin:0}.clear{border:0;background:none;color:#9a9b91;font:12px inherit;cursor:pointer}.history{display:flex;flex-direction:column;gap:9px}.history-row{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1px solid var(--line);padding:11px 12px;border-radius:12px}.history-left{display:flex;align-items:center;gap:9px}.history-icon{width:27px;height:27px;border-radius:9px;background:#f9e7e2;display:grid;place-items:center;font-size:12px;color:var(--red)}.history-date{font-size:11px;color:#77796f}.history-count{font:500 12px 'DM Mono',monospace}.empty{font-size:12px;color:#a0a197;line-height:1.8;padding:12px 1px}.quote{margin-top:auto;padding-top:22px;color:#8e9087;font-size:11px;line-height:1.8}.quote b{display:block;color:#66695f;font-size:11px;margin-bottom:3px}
.modal-backdrop{position:fixed;inset:0;background:#25282055;display:none;place-items:center;padding:20px;z-index:5}.modal-backdrop.show{display:grid}.modal{width:min(100%,390px);background:var(--paper);border-radius:20px;padding:25px;box-shadow:0 20px 80px #0002}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.modal-head h2{font-size:16px;margin:0}.close{border:0;background:none;font-size:21px;color:var(--muted);cursor:pointer}.field{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.field input[type=number]{width:70px;border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center;font:14px 'DM Mono',monospace;background:#fffefa;color:var(--ink)}.field input[type=checkbox]{accent-color:var(--red);width:16px;height:16px}.save{width:100%;margin-top:20px;height:44px;border:0;border-radius:11px;background:var(--ink);color:white;font:600 13px inherit;cursor:pointer}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;background:#292b26;color:white;padding:11px 17px;border-radius:11px;font-size:12px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){body{padding:12px}.app{grid-template-columns:1fr;min-height:0;border-radius:20px}.main{padding:23px 22px 26px;min-height:610px}.mode-tabs{margin-top:35px}.timer-wrap{width:min(290px,68vw);margin-top:27px}.time{font-size:68px}.side{border-left:0;border-top:1px solid #efede6;padding:24px 22px;min-height:290px}.quote{padding-top:22px}.hint{padding-top:20px}}
</style>
</head>
<body>
<div class="app">
 <main class="main">
  <header class="top"><div class="brand"><span class="brandmark">◷</span>pomodoro<span style="color:#a2a398;font-weight:400"> / focus</span></div><div class="top-actions"><button class="icon-btn" id="soundBtn" title="サウンド切替" aria-label="サウンド切替">♫</button><button class="icon-btn" id="settingsBtn" title="設定" aria-label="設定">⚙</button></div></header>
  <nav class="mode-tabs" aria-label="タイマーモード"><button class="mode active" data-mode="focus">集中</button><button class="mode" data-mode="short">短い休憩</button><button class="mode" data-mode="long">長い休憩</button></nav>
  <div class="timer-wrap"><svg class="ring" viewBox="0 0 220 220" aria-hidden="true"><circle class="track" cx="110" cy="110" r="101"/><circle class="progress" id="progress" cx="110" cy="110" r="101"/></svg><div class="timer-center"><div class="time" id="time">25:00</div><div class="timer-label" id="timerLabel">深く集中する時間</div><div class="session-dots" id="dots"></div></div></div>
  <input id="task" class="task" maxlength="80" placeholder="今取り組むことを入力…" aria-label="今取り組むこと">
  <div class="controls"><button class="secondary" id="resetBtn" title="リセット">↺</button><button class="primary" id="startBtn">スタート</button><button class="secondary" id="skipBtn" title="次へ">↪</button></div>
  <div class="hint">25分の集中 + 小休憩。ひとつずつ、着実に。</div>
 </main>
 <aside class="side"><h1 class="side-title">今日の進捗</h1><div class="stat-grid"><div class="stat"><div class="stat-label">完了したセッション</div><div class="stat-value"><span id="todayCount">0</span><span class="stat-unit">回</span></div></div><div class="stat"><div class="stat-label">集中した時間</div><div class="stat-value"><span id="todayMinutes">0</span><span class="stat-unit">分</span></div></div></div><hr class="divider"><div class="section-head"><h2>最近の記録</h2><button class="clear" id="clearHistory">クリア</button></div><div class="history" id="history"></div><div class="quote"><b>THE POMODORO TECHNIQUE</b>時間を区切ることで、集中と休息のリズムをつくります。</div></aside>
</div>
<div class="modal-backdrop" id="settingsModal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="modal-head"><h2 id="settingsTitle">タイマー設定</h2><button class="close" id="closeSettings" aria-label="閉じる">×</button></div><label class="field">集中時間（分）<input id="focusInput" type="number" min="1" max="90"></label><label class="field">短い休憩（分）<input id="shortInput" type="number" min="1" max="30"></label><label class="field">長い休憩（分）<input id="longInput" type="number" min="1" max="60"></label><label class="field">長い休憩までの回数<input id="cycleInput" type="number" min="2" max="8"></label><label class="field">終了時に通知する<input id="notifyInput" type="checkbox"></label><button class="save" id="saveSettings">保存する</button></section></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const defaults={focus:25,short:5,long:15,cycle:4,notify:false,sound:true};
let settings={...defaults,...JSON.parse(localStorage.getItem('pomo-settings')||'{}')};
let data=JSON.parse(localStorage.getItem('pomo-data')||'{"sessions":[]}');
let mode='focus',remaining=settings.focus*60,total=remaining,running=false,interval=null,endsAt=0,sessionCount=data.sessions.length;
const $=id=>document.getElementById(id), modes=[...document.querySelectorAll('.mode')], ring=$('progress'), circumference=2*Math.PI*101;
ring.style.strokeDasharray=circumference;ring.style.strokeDashoffset=0;
const mins={focus:()=>settings.focus,short:()=>settings.short,long:()=>settings.long};
function save(){localStorage.setItem('pomo-settings',JSON.stringify(settings));localStorage.setItem('pomo-data',JSON.stringify(data))}
function paint(){const m=Math.floor(remaining/60),s=remaining%60;$('time').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;ring.style.strokeDashoffset=circumference*(1-remaining/total);document.title=`${$('time').textContent} — ${mode==='focus'?'集中':'休憩'} | pomodoro`;}
function setMode(next){stop();mode=next;remaining=mins[mode]()*60;total=remaining;document.documentElement.style.setProperty('--accent',mode==='focus'?'var(--red)':'var(--green)');modes.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('timerLabel').textContent=mode==='focus'?'深く集中する時間':mode==='short'?'少しひと息':'長めにリフレッシュ';paint()}
function stop(){running=false;clearInterval(interval);interval=null;$('startBtn').textContent='スタート'}
function start(){if(running){stop();return}if(remaining<=0)remaining=total;running=true;endsAt=Date.now()+remaining*1000;$('startBtn').textContent='一時停止';interval=setInterval(()=>{remaining=Math.max(0,Math.ceil((endsAt-Date.now())/1000));paint();if(remaining===0)complete()},250)}
function complete(){stop();const finished=mode;if(finished==='focus'){data.sessions.unshift({date:new Date().toISOString(),task:$('task').value.trim()});sessionCount++;save();renderStats();if(sessionCount%settings.cycle===0)setMode('long');else setMode('short')}else setMode('focus');beep();if(settings.notify&&'Notification'in window){if(Notification.permission==='granted')new Notification('Pomodoro',{body:finished==='focus'?'おつかれさま！休憩しましょう。':'休憩終了。次の集中を始めましょう。'});else if(Notification.permission==='default')Notification.requestPermission()}toast(finished==='focus'?'セッション完了！おつかれさま':'休憩が終わりました')}
function beep(){if(!settings.sound)return;try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=.08;o.start();o.stop(c.currentTime+.22);setTimeout(()=>c.close(),400)}catch{}}
function renderStats(){const today=new Date().toLocaleDateString();const todays=data.sessions.filter(x=>new Date(x.date).toLocaleDateString()===today);$('todayCount').textContent=todays.length;$('todayMinutes').textContent=todays.length*settings.focus;const recent=data.sessions.slice(0,5);$('history').innerHTML=recent.length?recent.map(x=>`<div class="history-row"><div class="history-left"><span class="history-icon">✓</span><span class="history-date">${new Date(x.date).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})}　${new Date(x.date).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}${x.task?`<br><span style="color:#a2a398">${escapeHtml(x.task)}</span>`:''}</span></div><span class="history-count">+${settings.focus}分</span></div>`).join(''):'<div class="empty">まだ記録はありません。<br>最初のセッションを始めてみましょう。</div>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let toastTimer;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
modes.forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('startBtn').onclick=start;$('resetBtn').onclick=()=>{stop();remaining=total;paint()};$('skipBtn').onclick=()=>setMode(mode==='focus'?'short':'focus');$('soundBtn').onclick=()=>{settings.sound=!settings.sound;$('soundBtn').style.color=settings.sound?'':'#b7b8b0';save();toast(settings.sound?'サウンド ON':'サウンド OFF')};
$('settingsBtn').onclick=()=>{$('focusInput').value=settings.focus;$('shortInput').value=settings.short;$('longInput').value=settings.long;$('cycleInput').value=settings.cycle;$('notifyInput').checked=settings.notify;$('settingsModal').classList.add('show')};$('closeSettings').onclick=()=>$('settingsModal').classList.remove('show');$('settingsModal').onclick=e=>{if(e.target===$('settingsModal'))$('settingsModal').classList.remove('show')};$('saveSettings').onclick=()=>{for(const [key,id,max] of [['focus','focusInput',90],['short','shortInput',30],['long','longInput',60],['cycle','cycleInput',8]])settings[key]=Math.max(key==='cycle'?2:1,Math.min(max,Number($(id).value)||defaults[key]));settings.notify=$('notifyInput').checked;save();$('settingsModal').classList.remove('show');setMode(mode);renderStats();toast('設定を保存しました')};$('clearHistory').onclick=()=>{if(data.sessions.length&&!confirm('記録をすべて削除しますか？'))return;data.sessions=[];save();renderStats();toast('記録をクリアしました')};
if(!settings.sound)$('soundBtn').style.color='#b7b8b0';setMode('focus');renderStats();
})();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
